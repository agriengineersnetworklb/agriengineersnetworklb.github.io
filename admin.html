<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>إدارة الدليل الزراعي</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body class="admin-page"><main><section id="loginPanel" class="login-panel"><div class="login-card"><div class="brand-mark">🛡️</div><h1>إدارة الدليل الزراعي</h1><p>تسجيل دخول خاص بالمدراء المخوّلين فقط. يلزم إدخال كلمة المرور عند كل دخول.</p><form id="loginForm"><label>البريد الإلكتروني<input id="email" type="email" required autocomplete="email"></label><label>كلمة المرور<input id="password" type="password" required autocomplete="current-password"></label><button class="btn btn-primary" type="submit">تسجيل الدخول</button><p id="loginError" class="error"></p></form><a href="index.html">العودة إلى الدليل</a></div></section><section id="dashboard" hidden><header class="admin-header"><div><h1>لوحة إدارة الدليل</h1><p id="adminEmail"></p></div><div><a class="btn btn-light" href="index.html">عرض الموقع</a><button id="signOut" class="btn btn-light">خروج</button></div></header><div class="admin-shell"><div id="stats" class="stats"></div><div class="admin-tools"><input id="adminSearch" type="search" placeholder="بحث بالاسم، المالك، الهاتف أو المنطقة…"><select id="statusFilter"><option value="pending">بانتظار المراجعة</option><option value="approved">منشورة</option><option value="rejected">مرفوضة</option><option value="archived">مؤرشفة</option><option value="">كل الطلبات</option></select><button id="exportCsv" class="btn btn-light">تصدير كل البيانات CSV</button></div><div id="adminStatus" class="status"></div><div id="submissions" class="submissions"></div></div></section></main><dialog id="reviewDialog" class="review-dialog"><button class="close" aria-label="إغلاق">×</button><div id="reviewBody"></div></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js?v=full-cms-1"></script></body></html>
